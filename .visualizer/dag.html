<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="refresh" content="0; url=index.html#view=dag">
  <title>AI-Kit Visualizer — DAG</title>
  <script>
    (() => {
      'use strict';
      const current = new URL(window.location.href);
      const fromHash = new URLSearchParams(current.hash.replace(/^#/, ''));
      const task = current.searchParams.get('task') || fromHash.get('task');
      const target = new URL('index.html', current);
      target.hash = `view=dag${task ? `&task=${encodeURIComponent(task)}` : ''}`;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Opening the unified AI-Kit Visualizer… <a href="index.html#view=dag">Open DAG</a></p>
</body>
</html>
