<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI-Kit DAG</title><style>html,body,#dagMount{height:100%;margin:0}</style></head>
<body><div id="dagMount"></div><script src="dag-view.js"></script><script>
(() => { 'use strict'; const host=document.getElementById('dagMount'); let view;
  const empty={tasks:[],edges:[],waves:0,ready:[],critical_path:[]};
  async function fetchDag(){
    try { const m=await fetch('/artifacts/project/manifest.json',{cache:'no-store'}); if(!m.ok) throw Error(); const manifest=await m.json(); const r=await fetch('/artifacts/project/dag.json',{cache:'no-store'}); if(!r.ok) throw Error(); const a=await r.json(); if(manifest.schema_version!==1||a.schema_version!==1||a.generation_id!==manifest.generation_id) throw Error(); return a.data; }
    catch (_) { const r=await fetch('dag.json',{cache:'no-store'}); if(!r.ok) throw Error('dag.json unavailable'); return r.json(); }
  }
  async function refresh(){ try { const data=await fetchDag(); view ? view.setData(data) : view=window.AiKitDagView.mount(host,{data,onRefresh:refresh}); } catch(e) { view ? view.setData(empty) : view=window.AiKitDagView.mount(host,{data:empty,onRefresh:refresh}); console.warn('DAG unavailable',e); } }
  refresh(); setInterval(refresh,5000);
})();
</script></body></html>
