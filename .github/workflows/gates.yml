name: AI-Kit gates

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ai-kit-gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate kit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Add Git Bash to PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: echo "${env:ProgramFiles}\Git\bin" >> $env:GITHUB_PATH
      - name: Engine tests
        if: runner.os != 'Windows'
        run: python -m unittest discover -s tests -v
      - name: Windows engine smoke tests
        if: runner.os == 'Windows'
        run: python -m unittest tests.test_ai_kit.VerifyExitCodeTests tests.test_ai_kit.VisualizerManifestTests -v
      - name: Validate kit contracts
        run: bash .ai/scripts/check-kit.sh
      - name: Validate skill contracts
        run: bash .ai/scripts/check-skills.sh
      - name: Gate G4 hygiene
        run: bash .ai/scripts/check-gates.sh all

  # Browser-level regression tests for .visualizer/dag.html. Split into its
  # own job so the `validate` job above stays dependency-free (matching the
  # kit's stdlib-only engine): tests/test_dag_browser.py skips itself when
  # playwright is absent, and DAG_BROWSER_TESTS=required turns that skip
  # into a failure here so a broken install can't pass silently.
  visualizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Playwright + Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: DAG visualizer browser tests
        env:
          DAG_BROWSER_TESTS: required
        run: python -m unittest tests.test_dag_browser -v
