kit:
  id: ai-kit-v2
  version: 2.1.0
  entrypoint: AGENTS.md
  work_dir: .ai-work
  skills_dir: .ai/skills
  registry: .ai-config/registry.yaml

project:
  stack: []
  source_dirs: []

verification:
  test_command: true
  typecheck_command: true
  build_command: true
  lint_command: true

dispatch:
  # Repository-local by default so sandboxed Windows sessions can create it.
  # Override with AI_KIT_WORKTREE_ROOT or dispatch --worktree-root PATH.
  worktree_root: .ai-work/worktrees
