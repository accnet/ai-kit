roles:
  qa:
    enabled: false
    runner: codex-cli
    model: gpt-5.4-mini
    backup_runner: copilot-cli
    backup_model: gpt-5.4
  reviewer:
    enabled: false
    runner: claude-cli
    backup_runner: codex-cli
    backup_model: gpt-5.4-mini

post_completion:
  enabled: true
  retry_on_rejection: true
  max_retries: 2
  backup_after_retries: 1
  dispatch_ready_on_close: true
  dispatch_ready_limit: 1
