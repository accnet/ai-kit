# Runner profiles for `ai-kit dispatch` / `dispatch-ready` / `pipeline`.
#
# SAFETY: `dispatch` runs each command with stdin closed (it never waits for
# a human to answer a permission prompt), so every command below carries a
# non-interactive/auto-approve flag (--permission-mode acceptEdits,
# --auto-approve true, --allow-all-tools, ...) out of necessity -- without
# one, the runner's first tool-permission prompt would hang or fail with no
# way to answer it. This means the actual safety control here is NOT
# per-action confirmation; it's the review/QA gates (G2/G3 in AGENTS.md)
# that must pass before a dispatched task's work is accepted. Do not point
# `dispatch`/`dispatch-ready`/`pipeline` at a task or repo where unsupervised,
# full-tool-access execution by the runner CLI is unacceptable.
#
# MAINTENANCE: the model names below are a point-in-time example, tied to
# whatever each provider's CLI currently supports -- they will go stale.
# Before relying on a pinned name, check it against the installed CLI's own
# model list (e.g. `<cli> --help` or its docs) and update this file/its
# aliases to match what your installed CLI versions actually offer.
#
# NOTE: `ai-kit runner add` fully rewrites this file from its in-memory
# runner list and does not preserve these comments -- re-add them (or copy
# from `.ai/install/config/runners.yaml`) if you regenerate it that way.
default_executor: "codex-cli"
default_model: "gpt-5.6-terra"

runners:
  claude-cli:
    command: "env -u ANTHROPIC_AUTH_TOKEN -u ANTHROPIC_BASE_URL claude -p {prompt} --permission-mode acceptEdits"
    provider: "claude-cli"
    description: "Claude CLI runner"
    input: "json-file"
    capabilities: [implementation, refactoring, testing, review]
    roles: ["*"]
    task_kinds: [general, contract, implementation, integration]
    priority: 100
    max_parallel: 1
  codex-cli:
    command: "codex exec -m {model} --sandbox danger-full-access --ask-for-approval never {prompt}"
    models: ["gpt-5.6-luna", "gpt-5.6-terra", "gpt-5.4", "gpt-5.4-mini"]
    provider: "codex-cli"
    description: "Codex CLI runner"
    input: "json-file"
    capabilities: [implementation, refactoring, testing, review]
    roles: ["*"]
    task_kinds: [general, contract, implementation, integration]
    priority: 100
    max_parallel: 1
  cline-pass:
    command: "cline -P cline-pass -m 'cline-pass/{model}' --auto-approve true {prompt}"
    models: ["glm-5.2"]
    provider: "cline-pass"
    description: "Cline pass runner"
    capabilities: [implementation, testing]
    roles: ["*"]
    task_kinds: [general, implementation]
    priority: 50
    max_parallel: 1
  cline:
    command: "cline -P deepseek -m '{model}' --auto-approve true {prompt}"
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
    provider: "cline"
    description: "Cline DeepSeek runner"
    capabilities: [implementation, testing, review]
    roles: ["*"]
    task_kinds: [general, implementation]
    priority: 50
    max_parallel: 1
  opencode-cli:
    command: "opencode run {prompt} --model deepseek/{model}"
    models: ["deepseek-v4-flash", "deepseek-v4-pro"]
    provider: "opencode-cli"
    description: "OpenCode CLI runner"
    capabilities: [implementation, testing, review]
    roles: ["*"]
    task_kinds: [general, implementation]
    priority: 60
    max_parallel: 1
  copilot-cli:
    command: "copilot -p {prompt} --model {model} --allow-all-tools --log-level error"
    models: ["gpt-5.6-luna", "gpt-5.6-terra", "gemini-3.6-flash", "gemini-3.5-flash", "gpt-5.4", "gpt-5.4-mini", "claude-opus-4.8-fast", "grok-4.5", "kimi-k2.7-code", "gpt-4o", "gpt-4o-mini", "gpt-4o-mini-2024-08-23"]
    provider: "copilot-cli"
    description: "GitHub Copilot CLI runner"
    input: "json-file"
    capabilities: [implementation, refactoring, testing, review]
    roles: ["*"]
    task_kinds: [general, contract, implementation, integration]
    priority: 90
    max_parallel: 1

runner_aliases:
  claude: "claude-cli"
  codex-5.6-luna: "codex-cli:gpt-5.6-luna"
  codex-5.6-terra: "codex-cli:gpt-5.6-terra"
  codex-5.4: "codex-cli:gpt-5.4"
  codex-5.4-mini: "codex-cli:gpt-5.4-mini"
  cline-pass: "cline-pass:glm-5.2"
  deepseek-v4-flash: "cline:deepseek-v4-flash"
  deepseek-v4-pro: "cline:deepseek-v4-pro"
  opencode-deepseek-v4-flash: "opencode-cli:deepseek-v4-flash"
  opencode-deepseek-v4-pro: "opencode-cli:deepseek-v4-pro"
  copilot-gpt-5.6-luna: "copilot-cli:gpt-5.6-luna"
  copilot-gpt-5.6-terra: "copilot-cli:gpt-5.6-terra"
  copilot-gemini-3.6-flash: "copilot-cli:gemini-3.6-flash"
  copilot-gemini-3.5-flash: "copilot-cli:gemini-3.5-flash"
  copilot-gpt-5.4: "copilot-cli:gpt-5.4"
  copilot-gpt-5.4-mini: "copilot-cli:gpt-5.4-mini"
  copilot-claude-opus-4.8-fast: "copilot-cli:claude-opus-4.8-fast"
  copilot-grok-4.5: "copilot-cli:grok-4.5"
  copilot-kimi-k2.7-code: "copilot-cli:kimi-k2.7-code"
