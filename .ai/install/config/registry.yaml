  nestjs-data-access: {path: .ai/skills/backend/nestjs-data-access, stack: [nestjs, database]}
  vite-frontend: {path: .ai/skills/frontend/vite-frontend, stack: [vite]}
  react-vite: {path: .ai/skills/frontend/react-vite, stack: [react, vite]}
  vitest-testing: {path: .ai/skills/testing/vitest-testing, stack: [vitest]}
  docker-compose-local: {path: .ai/skills/devops/docker-compose-local, stack: [docker, compose]}
  backend-python: {path: .ai/skills/backend/python, stack: [python]}
  backend-fastapi: {path: .ai/skills/backend/fastapi, stack: [python, fastapi]}
  backend-outbox-pattern: {path: .ai/skills/backend/distributed/outbox-pattern, stack: [distributed, outbox, events]}
  backend-saga-orchestrator: {path: .ai/skills/backend/distributed/saga-orchestrator, stack: [distributed, saga, orchestration]}
  backend-circuit-breaker: {path: .ai/skills/backend/distributed/circuit-breaker-and-fallback, stack: [distributed, resilience, circuit-breaker]}
  frontend-typescript: {path: .ai/skills/frontend/typescript, stack: [typescript]}
  frontend-nextjs: {path: .ai/skills/frontend/nextjs, stack: [nextjs, react]}
  frontend-tailwind: {path: .ai/skills/frontend/tailwind, stack: [tailwind]}
  testing-pytest: {path: .ai/skills/testing/pytest, stack: [pytest, python]}
